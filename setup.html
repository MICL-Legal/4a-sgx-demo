<title>4A 裝機精靈</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --paper:#f5f0e6;--card:#efe7d6;--card2:#e4dccb;--ink:#2b2620;--soft:#6d6456;--faint:#93897a;--line:#ddd1bc;
    --accent:#9a6634;--accent2:#b98a52;--good:#5a7d4a;--good-bg:#e4ecdc;--paste:#2b2620;--paste-ink:#f0e6d4;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans CJK TC","Microsoft JhengHei",sans-serif;
    --serif:Georgia,"Songti TC","Noto Serif CJK TC",serif;--mono:ui-monospace,"SF Mono",Menlo,monospace;
  }
  @media (prefers-color-scheme:dark){:root{--paper:#201c17;--card:#2a2419;--card2:#332b1e;--ink:#ece3d3;--soft:#b3a892;--faint:#8c8271;--line:#3a3226;--accent:#d09a5f;--accent2:#b6844f;--good:#8fb079;--good-bg:#2b3324;--paste:#15120d;--paste-ink:#ece3d3;}}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.7;-webkit-font-smoothing:antialiased;padding:clamp(.8rem,3vw,2rem)}
  .wrap{max-width:1000px;margin:0 auto}
  header{margin-bottom:1.2rem}
  .eyebrow{font-size:.72rem;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);font-weight:700}
  h1{font-family:var(--serif);font-size:clamp(1.6rem,5vw,2.2rem);margin:.3rem 0 .3rem}
  .lede{color:var(--soft);font-size:1rem;max-width:36rem}
  .bar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin:1rem 0 .4rem}
  .bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:99px;transition:width .4s}
  .barlab{font-size:.82rem;color:var(--faint);font-weight:700;text-align:right}
  .osrow{display:flex;gap:.5rem;align-items:center;margin:1rem 0 1.2rem}
  .osrow .k{font-size:.85rem;color:var(--soft);font-weight:600;margin-right:.2rem}
  .seg{display:inline-flex;background:var(--card2);border-radius:10px;padding:3px}
  .seg button{font-family:inherit;font-size:.9rem;font-weight:700;border:0;background:transparent;color:var(--soft);padding:.45rem 1.1rem;border-radius:8px;cursor:pointer}
  .seg button.on{background:var(--accent);color:#fff}

  .layout{display:grid;grid-template-columns:320px 1fr;gap:1.3rem;align-items:start}
  @media(max-width:720px){.layout{grid-template-columns:1fr}}
  .rail{display:flex;flex-direction:column;gap:.7rem}
  .rstep{display:flex;align-items:flex-start;gap:.8rem;padding:.85rem .95rem;border-radius:13px;cursor:pointer;background:var(--card);border:1px solid var(--line);transition:border-color .15s}
  .rstep:hover{border-color:var(--accent2)}
  .rstep.cur{border-color:var(--accent);border-width:2px}
  .rstep .dot{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--card2);color:var(--faint);font-weight:700;font-size:.9rem;display:flex;align-items:center;justify-content:center;border:2px solid var(--line);margin-top:1px}
  .rstep.cur .dot{border-color:var(--accent);color:var(--accent);background:var(--paper)}
  .rstep.done .dot{background:var(--accent);border-color:var(--accent);color:#fff}
  .rtx{display:flex;flex-direction:column;gap:2px}
  .rt{font-size:.98rem;font-weight:700;line-height:1.3}
  .rd{font-size:.8rem;color:var(--soft);line-height:1.45}
  .rstep.done .rt{color:var(--faint)}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:clamp(1.1rem,3vw,1.7rem)}
  .stepno{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700}
  .panel h2{font-family:var(--serif);font-size:1.5rem;margin:.25rem 0 .5rem}
  .why{background:var(--card2);border-radius:10px;padding:.7rem .9rem;font-size:.95rem;color:var(--soft);margin-bottom:1.1rem}
  .why b{color:var(--ink)}
  .do{font-weight:700;margin:.2rem 0 .5rem}
  .cmd{background:var(--paste);border-radius:12px;overflow:hidden;margin:.5rem 0 1rem}
  .cmd.keybox{border:2px solid var(--accent)}
  .cmd .top{display:flex;align-items:center;justify-content:space-between;padding:.5rem .8rem;border-bottom:1px solid rgba(255,255,255,.08)}
  .cmd .top .t{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:#b9a986;font-weight:700}
  .cmd .copy{font-family:inherit;font-size:.8rem;font-weight:700;background:var(--accent);color:#fff;border:0;border-radius:7px;padding:.35rem .8rem;cursor:pointer}
  .cmd pre{margin:0;padding:.85rem .9rem;font-family:var(--mono);font-size:.82rem;line-height:1.65;color:var(--paste-ink);white-space:pre-wrap;word-break:break-all;max-height:180px;overflow:auto}
  details.ex{margin:.2rem 0 1rem;background:var(--card2);border:1px solid var(--line);border-radius:10px}
  details.ex summary{cursor:pointer;padding:.7rem .9rem;font-weight:700;font-size:.9rem;color:var(--accent);list-style:none}
  details.ex summary::-webkit-details-marker{display:none}
  details.ex summary::before{content:"＋ ";font-weight:800}
  details.ex[open] summary::before{content:"− "}
  details.ex .exb{padding:0 .9rem .9rem;font-size:.88rem;line-height:1.7;color:var(--soft)}
  .panel code{font-family:var(--mono);background:var(--card2);padding:.1rem .35rem;border-radius:4px;font-size:.85em;color:var(--accent)}
  .deptsel{font-family:inherit;font-size:1rem;font-weight:700;padding:.6rem .9rem;border-radius:10px;border:2px solid var(--accent);background:var(--card2);color:var(--ink);margin-bottom:.9rem;cursor:pointer;width:100%;max-width:300px}
  .links{display:flex;flex-direction:column;gap:.5rem;margin:.3rem 0 1rem}
  .lk{display:flex;align-items:center;justify-content:space-between;background:var(--card2);border-radius:10px;padding:.7rem .9rem;text-decoration:none;color:var(--ink);font-weight:600}
  .lk .u{font-size:.82rem;color:var(--accent);font-family:var(--mono)}
  .ok{display:flex;gap:.5rem;align-items:flex-start;background:var(--good-bg);border-radius:10px;padding:.7rem .9rem;font-size:.92rem;margin:.2rem 0 1.2rem}
  .ok .c{color:var(--good);font-weight:800}
  .nav{display:flex;gap:.7rem;flex-wrap:wrap}
  button.next{font-family:inherit;font-size:1rem;font-weight:700;background:var(--accent);color:#fff;border:0;border-radius:11px;padding:.75rem 1.4rem;cursor:pointer}
  button.prev{font-family:inherit;font-size:.95rem;font-weight:600;background:transparent;color:var(--soft);border:1px solid var(--line);border-radius:11px;padding:.75rem 1.1rem;cursor:pointer}
  .done-panel{text-align:center;padding:2rem 1rem}
  .done-panel .big{font-family:var(--serif);font-size:1.8rem;color:var(--accent);margin:.4rem 0}
  .done-panel p{color:var(--soft);max-width:26rem;margin:.4rem auto}
  .foot{text-align:center;color:var(--faint);font-size:.78rem;margin-top:1.4rem}
</style>
<div class="wrap">
  <header>
    <p class="eyebrow">1 · 會前會 · 上課前約 10 分鐘</p>
    <h1>4A 裝機精靈</h1>
    <p class="lede">一步一步跟著做，把電腦準備好。整個「會前會」就是這 6 步（1-1 ～ 1-6），每一步只做一件事，做完按「下一步」——不會迷路。</p>
    <div class="bar"><i id="fill"></i></div>
    <div class="barlab" id="barlab">1-1 · 第 1 步 / 共 6 步</div>
    <div class="osrow">
      <span class="k">你的電腦是：</span>
      <div class="seg"><button id="mac" class="on">Mac</button><button id="win">Windows</button></div>
    </div>
  </header>
  <div class="layout">
    <div class="rail" id="rail"></div>
    <div class="panel" id="panel"></div>
  </div>
  <p class="foot">4A AI 工作坊 · 會前會裝機精靈　|　上課統一用 Claude Code；Codex／Antigravity 為下課自選</p>
</div>

<script>
  const steps=[
    {t:'貼上 API key',no:'1-1',desc:'讓 AI 動起來的鑰匙，工作坊直接發給你',
     why:'這是讓 AI 動起來的「鑰匙」。<b>工作坊直接發一把（公司的）key 給你</b>——你<b>不用有 Claude 帳號、不用訂閱、不用花錢</b>。<b>先把 key 放好（這一步），等下裝好打 claude 就直接能用，不會叫你登入任何帳號。</b>',
     keyslot:true,
     ok:'終端機沒跳出紅色錯誤訊息 = 這把 key 已經放好。先別急著打 claude——下一步（1-2）把它裝起來，才會用到這把 key。'},
    {t:'裝你的 AI 主角',no:'1-2',desc:'主角 Claude Code；Codex／Antigravity 下課自選',
     why:'今天的主角——一個坐你旁邊、聽你打字指揮、<b>直接幫你動手</b>的 AI（Claude Code），住在「終端機」裡。<b>上課統一用這個。</b>另外兩個（Codex、Antigravity）是下課想自己玩再裝，完整步驟都收在下面。',
     mac:{do:'① 用放大鏡（Spotlight）搜 <b>Terminal</b> 打開。② 把這行貼進去、按 Enter：',cmd:'curl -fsSL https://claude.ai/install.sh | bash'},
     win:{do:'① 開「Windows Terminal」（<b>不是 CMD</b>）。② 把這行貼進去、按 Enter：',cmd:'irm https://claude.ai/install.ps1 | iex'},
     ok:'裝好後重開終端機、打 claude → 它問「信任這把 key 嗎？」→ 按信任（y）→ 進到對話畫面 = 成功。因為 key 上一步已放好（重開也不會掉），不會叫你登入 Claude 帳號。',
     extra:'<details class="ex"><summary>加裝 Codex（OpenAI，用你自己的 ChatGPT）· 完整步驟</summary><div class="exb"><b>下課自選，上課用不到。</b>用你自己的 ChatGPT 訂閱（需 Plus 以上；免費版不一定能用）。<br><br><b>① 裝 · Mac：</b>終端機貼這行、按 Enter：<br><code>curl -fsSL https://chatgpt.com/codex/install.sh | sh</code><br><b>① 裝 · Windows：</b>Windows Terminal 貼這行、按 Enter：<br><code>irm https://chatgpt.com/codex/install.ps1 | iex</code><br><br><b>② 開 + 登入：</b>打 <code>codex</code> 按 Enter → 選「Sign in with ChatGPT」→ 會自動跳出瀏覽器、用你的 ChatGPT 帳號登入 → 登入成功回到終端機就能用。<br><b>成功長這樣：</b>打 codex 出現對話畫面。</div></details><details class="ex"><summary>加裝 Antigravity（Google，是一個 App）· 完整步驟</summary><div class="exb"><b>下課自選，上課用不到。</b>注意：它是<b>一個要下載的桌面 App（不是終端機指令）</b>，而且<b>只能用個人 @gmail 登入，公司的 Google 帳號會被擋掉</b>。<br><br><b>① 下載：</b>瀏覽器開 <a href="https://antigravity.google/download" target="_blank" rel="noopener">antigravity.google/download</a>。Mac 選「Apple Silicon」（較新 M 系列）或「Intel」（較舊）；Windows 選 Windows（x64）。<br><b>② 安裝：</b>打開下載好的安裝檔，照畫面按「下一步」裝完。<br><b>③ 開 + 登入：</b>從「應用程式」／開始選單打開 Antigravity → 用<b>個人 Google（@gmail）</b>帳號登入 → 跳瀏覽器登入後自動回到 App。<br><b>成功長這樣：</b>進到 Antigravity 的編輯器畫面。</div></details>'},
    {t:'裝地基工具',no:'1-3',desc:'git、Python、Node，讓 AI 能做更多、能接工具',
     why:'這些是地基（<b>git、Python、Node</b>），讓 AI 能幫你抓別人的專案、跑程式，還能接工具（1-5 要接的 Google Sheets 就靠 Node）。',
     mac:{do:'貼這一整行、按 Enter，等它跑完：',cmd:'xcode-select --install 2>/dev/null; curl -LsSf https://astral.sh/uv/install.sh | sh && export PATH="$HOME/.local/bin:$PATH" && uv python install 3.11 && echo "地基裝好了"'},
     win:{do:'貼這一整行、按 Enter，等它跑完：',cmd:'winget install --id Git.Git -e --silent --accept-package-agreements --accept-source-agreements; winget install --id OpenJS.NodeJS.LTS -e --silent --accept-package-agreements --accept-source-agreements; irm https://astral.sh/uv/install.ps1 | iex; & "$env:USERPROFILE\\.local\\bin\\uv.exe" python install 3.11; Write-Host "地基裝好了"'},
     ok:'沒跳紅字、印出「地基裝好了」= 成功。',
     extra:'<div class="ok" style="background:var(--card2);color:var(--soft);margin-top:.2rem"><span class="c" style="color:var(--accent);white-space:nowrap">＋ Node</span><span>1-5 接 Google Sheets 需要 Node。<b>Windows</b> 已含在上面那行。<b>Mac</b> 請另外到 <a href="https://nodejs.org" target="_blank" rel="noopener">nodejs.org</a> 下載 <b>LTS</b> 版、雙擊安裝（裝完打 <code>node -v</code> 看到 v20 以上就好）。</span></div>'},
    {t:'裝 2 個工作坊 skill',no:'1-4',desc:'兩張方法卡，讓 AI 照工作坊的方法幫你',
     why:'這兩張「方法卡」（需求逼結構、交辦清單）讓 AI 自動照工作坊的方法幫你，你不用背任何口訣。',
     mac:{do:'貼這一行：',cmd:'curl -fsSL https://raw.githubusercontent.com/MICL-Legal/4a-sgx-demo/main/install-skills.sh | bash'},
     win:{do:'貼這一行：',cmd:'irm https://raw.githubusercontent.com/MICL-Legal/4a-sgx-demo/main/install-skills.ps1 | iex'},
     ok:'螢幕出現「已裝好 2 個 skill」= 成功。'},
    {t:'接 Google Sheets',no:'1-5',desc:'讓 Claude Code 能讀寫你的 Google 試算表（飲料店 demo 用）',
     why:'這一步讓你打一句話、Claude Code 就寫進你的 Google 試算表——就是 Devin 飲料店那個「說→做」。要先去 Google Cloud 拿一把「服務帳戶金鑰（JSON）」，再一行接好。',
     doonly:'跟著這頁做——每一步都有直接連結、結尾有卡關表，不會迷路：',
     links:[{n:'📄 打開 GCP → Sheets 完整教學（點我）',u:'micl-legal.github.io/4a-sgx-demo/gcp-sheets.html'}],
     ok:'照教學頁做完、跑最後那一行，打 claude mcp list 看到 mcp-gsheets ✔ Connected = 通了。'},
    {t:'公司帳號（已幫你開好）',no:'1-6',desc:'Zapier、Make 公司已開通，不用自己辦',
     why:'工作坊會用到的 <b>Zapier</b> 和 <b>Make</b>（自動化工具），公司已經幫各部門開通好了——<b>你不用自己註冊</b>。登入用的帳號當天由主辦提供。',
     links:[{n:'Make 登入',u:'make.com'},{n:'Zapier 登入',u:'zapier.com'}],
     ok:'兩個都能用主辦給的帳號登入，就準備好了。'}
  ];
  let cur=0, os='mac', userkey='', done=Array(steps.length).fill(false);
  const $=id=>document.getElementById(id);
  function renderRail(){
    $('rail').innerHTML=steps.map((s,k)=>`<div class="rstep ${k===cur?'cur':''} ${done[k]?'done':''}" data-k="${k}"><span class="dot">${done[k]?'✓':k+1}</span><div class="rtx"><span class="rt">${s.no}　${s.t}</span><span class="rd">${s.desc}</span></div></div>`).join('');
    document.querySelectorAll('.rstep').forEach(e=>e.onclick=()=>{cur=+e.dataset.k;render();});
  }
  function render(){
    const doneCount=done.filter(Boolean).length;
    $('fill').style.width=(doneCount/steps.length*100)+'%';
    if(cur>=steps.length){renderDone();renderRail();return;}
    const s=steps[cur], o=s[os]||{};
    $('barlab').textContent=s.no+' · 第 '+(cur+1)+' 步 / 共 '+steps.length+' 步';
    let body=`<div class="stepno">${s.no}　·　第 ${cur+1} 步 / 共 ${steps.length} 步</div><h2>${s.t}</h2><div class="why">${s.why}</div>`;
    if(s.keyslot){
      body+='<p class="do">第 1 步　把主辦發給你的 API key 貼在這個欄位：</p>';
      body+='<input id="keyin" class="deptsel" style="max-width:100%;font-family:var(--mono);font-size:.86rem" placeholder="貼上 sk-ant-… 開頭那一整串" value="'+(userkey||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')+'">';
      var kv=(userkey&&userkey.trim())?userkey.trim():'貼上你的KEY';
      var cmdline=(os==='win')?('setx ANTHROPIC_API_KEY "'+kv+'"'):('echo \'export ANTHROPIC_API_KEY="'+kv+'"\' >> ~/.zshrc && export ANTHROPIC_API_KEY="'+kv+'"');
      body+='<p class="do">第 2 步　你的完整指令會自動長出來 —— 按「複製整行」：</p>';
      body+='<div class="cmd keybox"><div class="top"><span class="t">'+(os==='win'?'Windows 版（setx）':'Mac 版（export）')+'</span><button class="copy" id="keycopy" data-cmd="'+cmdline.replace(/"/g,'&quot;')+'">複製整行</button></div><pre id="keyout">'+cmdline.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</pre></div>';
      body+='<div class="ok" style="background:var(--card2);color:var(--soft);margin-top:.2rem"><span class="c" style="color:var(--accent);white-space:nowrap">🔒 放心</span><span>你貼的 key 只留在你自己這台的瀏覽器裡，不會上傳到任何地方——這頁沒有伺服器、不記錄；關掉分頁就沒了。</span></div>';
      if(os==='win'){
        body+='<p class="do">第 3 步　打開「Windows Terminal」（不是 CMD）。<br>第 4 步　貼上剛剛複製的那一整行、按 Enter。<br>第 5 步　<b>把 Windows Terminal 關掉、重新打開一次</b>（Windows 用 setx，要重開才生效）。</p>';
      }else{
        body+='<p class="do">第 3 步　用放大鏡（Spotlight）搜「Terminal」打開。<br>第 4 步　貼上剛剛複製的那一整行、按 Enter —— 就設定好了。</p>';
      }
    }
    if(s.doonly){body+=`<p class="do">${s.doonly}</p>`;}
    if(o.do){body+=`<p class="do">${o.do}</p>`;}
    if(o.cmd){body+=`<div class="cmd"><div class="top"><span class="t">複製整行貼進去</span><button class="copy" data-cmd="${o.cmd.replace(/"/g,'&quot;')}">複製</button></div><pre>${o.cmd.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</pre></div>`;}
    if(s.links){body+=`<div class="links">`+s.links.map(l=>`<a class="lk" href="https://${l.u}" target="_blank" rel="noopener"><span>${l.n}</span><span class="u">${l.u} ↗</span></a>`).join('')+`</div>`;}
    body+=`<div class="ok"><span class="c">✓ 成功長這樣</span><span>${s.ok}</span></div>`;
    if(s.extra){body+=s.extra;}
    body+=`<div class="nav">${cur>0?'<button class="prev" id="prev">上一步</button>':''}<button class="next" id="next">✓ 我做好了，下一步</button></div>`;
    $('panel').innerHTML=body;
    $('panel').querySelectorAll('.copy').forEach(cp=>{cp.onclick=()=>{try{navigator.clipboard.writeText(cp.dataset.cmd.replace(/&quot;/g,'"'));}catch(e){}const t=cp.textContent;cp.textContent='已複製 ✓';setTimeout(()=>cp.textContent=t,1500);};});
    var ki=$('keyin');if(ki){ki.oninput=function(){userkey=ki.value;var kv=(userkey&&userkey.trim())?userkey.trim():'貼上你的KEY';var cmd=(os==='win')?('setx ANTHROPIC_API_KEY "'+kv+'"'):('echo \'export ANTHROPIC_API_KEY="'+kv+'"\' >> ~/.zshrc && export ANTHROPIC_API_KEY="'+kv+'"');if($('keyout'))$('keyout').textContent=cmd;if($('keycopy'))$('keycopy').setAttribute('data-cmd',cmd);};}
    $('next').onclick=()=>{done[cur]=true;cur++;render();};
    if($('prev'))$('prev').onclick=()=>{cur--;render();};
    renderRail();
  }
  function renderDone(){
    $('barlab').textContent='全部完成 🎉';$('fill').style.width='100%';
    $('panel').innerHTML=`<div class="done-panel"><div class="stepno">DONE</div><div class="big">全部準備好了！</div><p>1-1 到 1-5 都完成，你跟全班站在同一條起跑線了。上課當天直接開跑，不會卡在裝機。</p><p style="margin-top:1rem"><button class="prev" id="again">← 回去檢查某一步</button></p></div>`;
    $('again').onclick=()=>{cur=steps.length-1;render();};
  }
  $('mac').onclick=()=>{os='mac';$('mac').classList.add('on');$('win').classList.remove('on');render();};
  $('win').onclick=()=>{os='win';$('win').classList.add('on');$('mac').classList.remove('on');render();};
  render();
</script>
